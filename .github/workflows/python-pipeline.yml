# Testa o pipeline Python: tabelas limpas, banco SQL, totais do TSE e os notebooks.
name: Pipeline Python (testes e notebooks)

on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**', 'notebooks/**', 'sql/**', 'tests/**', 'requirements.txt', 'pyproject.toml', '.github/workflows/python-pipeline.yml']
  pull_request:
    paths: ['data/**', 'scripts/**', 'notebooks/**', 'sql/**', 'tests/**', 'requirements.txt', 'pyproject.toml', '.github/workflows/python-pipeline.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint e formatação (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (pytest)
        run: pytest -q tests
      - name: Limpeza reproduz data/limpo/
        working-directory: notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=600 limpeza_dados.ipynb
          git diff --exit-code --stat -- ../data/limpo
      - name: Análise estatística do perfil roda do início ao fim
        working-directory: notebooks
        run: jupyter nbconvert --to notebook --execute --output /tmp/analise_perfil.ipynb --ExecutePreprocessor.timeout=600 analise_perfil.ipynb
