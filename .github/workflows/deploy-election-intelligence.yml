# Publica o ELECTION INTELLIGENCE no GitHub Pages a cada push na main que altere a pasta do site.
name: Deploy ELECTION INTELLIGENCE (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['election-intelligence/**', '.github/workflows/deploy-election-intelligence.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: election-intelligence/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: election-intelligence/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
