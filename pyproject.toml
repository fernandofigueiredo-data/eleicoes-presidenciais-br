[project]
name = "eleicoes-presidenciais-br"
version = "1.0.0"
description = "Eleições presidenciais no Brasil (2014–2026): coleta, limpeza, SQL, Power BI, análise e site"
requires-python = ">=3.10"
license = "MIT"

# Lint e formatação do código Python (scripts/ e tests/). Rode: ruff check . && ruff format --check .
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["election-intelligence", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0915", "PLR0912", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
